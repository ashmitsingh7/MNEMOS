amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 300
    max_particles: 1500
    laser_model_type: likelihood_field
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_nav_to_pose_bt_xml: navigate_to_pose_w_replanning_and_recovery.xml
controller_server:
  ros__parameters:
    use_sim_time: true
    cmd_vel_topic: /cmd_vel_autonomy
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 12.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      max_vel_x: 0.35
      min_vel_x: 0.0
      max_vel_theta: 1.2
      acc_lim_x: 1.5
      acc_lim_theta: 2.5
      vx_samples: 20
      vtheta_samples: 20
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.3
      allow_unknown: false
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3.5
      height: 3.5
      resolution: 0.05
      robot_radius: 0.25
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, max_obstacle_height: 1.5}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45}
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.25
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, max_obstacle_height: 1.5}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45}
map_server:
  ros__parameters: {use_sim_time: true, yaml_filename: ""}
behavior_server:
  ros__parameters: {use_sim_time: true, global_frame: odom, robot_base_frame: base_footprint, local_frame: odom}
lifecycle_manager_navigation:
  ros__parameters: {use_sim_time: true, autostart: true, node_names: [controller_server, planner_server, behavior_server, bt_navigator]}
